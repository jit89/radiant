[package]
name = "notes"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.7", features = ["catch-panic"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "g1"
path = "tests/acceptance/g1.rs"

[[test]]
name = "g2"
path = "tests/acceptance/g2.rs"

[[test]]
name = "g3"
path = "tests/acceptance/g3.rs"
